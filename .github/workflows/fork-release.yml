# Release builds for this fork. Kept separate from upstream's workflows so
# that syncing with upstream never conflicts here.
#
# A push to a `ci/**` branch builds every platform and uploads the packages
# as Actions artifacts, for debugging the workflow itself.
name: fork_release

on:
  push:
    branches:
      - "ci/**"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-15
    env:
      # Same floor as upstream; the arm64 target's own floor is higher.
      MACOSX_DEPLOYMENT_TARGET: "10.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Name the package
        id: name
        shell: bash
        run: echo "label=$(ci/fork-release-label.sh)" >> "$GITHUB_OUTPUT"
      - name: Install Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: >-
          cargo build --release --target ${{ matrix.target }}
          -p wezterm-gui -p wezterm -p wezterm-mux-server -p strip-ansi-escapes
      - name: Install just
        shell: bash
        run: brew install just
      - name: Package
        shell: bash
        run: >-
          ci/fork-package-macos.sh
          "target/${{ matrix.target }}/release"
          "WezTerm-${{ steps.name.outputs.label }}-macos-${{ matrix.arch }}"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            WezTerm-*.zip
            WezTerm-*.zip.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    env:
      RUSTUP_WINDOWS_PATH_ADD_BIN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Name the package
        id: name
        shell: bash
        run: echo "label=$(ci/fork-release-label.sh)" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      # Upstream's workflow vendors dependencies into .cargo/config, which
      # makes cargo ignore .cargo/config.toml and with it +crt-static, so the
      # binaries would need the VC++ runtime installed. Release builds do not
      # vendor.
      - name: Build
        shell: bash
        run: |
          export PATH="/c/Strawberry/perl/bin:$PATH"
          cargo build --release -p wezterm-gui -p wezterm -p wezterm-mux-server -p strip-ansi-escapes
      - name: Package
        shell: bash
        run: >-
          ci/fork-package-windows.sh target/release
          "WezTerm-${{ steps.name.outputs.label }}-windows-x86_64"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            WezTerm-*.zip
            WezTerm-*.zip.sha256
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Name the package
        id: name
        shell: bash
        run: echo "label=$(ci/fork-release-label.sh)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl
      # Cross.toml's pre-build hooks need cross from git; the crates.io
      # release ignores them.
      - name: Install cross
        shell: bash
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        shell: bash
        run: >-
          cross build --release --target x86_64-unknown-linux-musl
          -p wezterm -p wezterm-mux-server
      - name: Package
        shell: bash
        run: >-
          ci/fork-package-linux.sh target/x86_64-unknown-linux-musl/release
          "wezterm-${{ steps.name.outputs.label }}-linux-x86_64-musl"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-musl
          path: |
            wezterm-*.tar.gz
            wezterm-*.tar.gz.sha256
          if-no-files-found: error
